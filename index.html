<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marble Race 2D</title><link rel="stylesheet" href="style.css"></head><body>
<section id="setup"><header><b>MARBLE RACE</b><button id="reset">RESET</button></header><main><h1>15 MARBLES</h1><p>Chọn ảnh và nhập tên. Mỗi màn có 3 marble.</p><div id="grid"></div><button id="start">START RACE ▶</button></main></section>
<section id="race" class="hide"><header><button id="back">←</button><div><b id="round">Round 1</b><small id="roundCount">3 racers</small></div><button id="restart">↻</button></header><main class="raceMain"><div class="stage"><div class="stageInfo"><b id="stage">Stage 1</b><span>🔵 XANH = ĐI TIẾP　🔴 ĐỎ = RESET</span></div><div class="canvasBox"><canvas id="game" width="900" height="1200"></canvas><div id="countdown" class="overlay hide"></div><div id="message" class="message hide"></div></div></div><div id="players"></div></main></section>
<section id="winner" class="hide winner"><div><div class="trophy">🏆</div><small>CHAMPION</small><h1 id="winnerName"></h1><button id="again">RACE AGAIN ▶</button></div></section>
<input id="picker" type="file" accept="image/*" hidden>
<div id="editor" class="hide editor"><div><b>MAP EDITOR</b><small>Kéo trên canvas để thêm tường</small><button id="defaultMap">DEFAULT</button><button id="clearMap">CLEAR</button><button id="doneMap">DONE</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script><script src="app.js"></script></body></html>
